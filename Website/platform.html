<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theia-Stack — AI Compliance Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#111111;--navy-light:#2C2C2C;--gold:#B83232;--gold-light:#fdf0f0;
  --cream:#F2F2F2;--white:#ffffff;--border:#D0D0D0;--border-strong:#B0B0B0;
  --muted:#5A5A5A;--text:#111111;--text-light:#888888;
  --green:#1a7a46;--green-bg:#e8f5ee;--green-border:#9fe1cb;
  --amber:#c97d10;--amber-bg:#fdf3e3;--amber-border:#f5c475;
  --red:#b83232;--red-bg:#fdf0f0;--red-border:#f0b0b0;
  --blue:#185fa5;--blue-bg:#e6f1fb;
  --radius:10px;--radius-lg:16px;--radius-xl:24px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 4px 24px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);
  --sidebar:240px;
  --font-display:'DM Serif Display',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font-body);background:var(--cream);color:var(--text);font-size:14px;line-height:1.6;}
a{color:var(--navy);text-decoration:none;}

/* Layout */
.app{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar);background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh;}

/* Sidebar */
.sb-brand{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.sb-logo-mark{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-logo-mark svg{width:36px;height:36px;}
.sb-logo-text{font-family:var(--font-display);font-size:18px;color:#fff;letter-spacing:-.02em;}
.sb-tagline{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.04em;text-transform:uppercase;padding-left:42px;}
.sb-firm{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-firm-label{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.sb-firm-name{font-size:13px;color:rgba(255,255,255,.85);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-nav{padding:16px 12px;flex:1;}
.sb-nav-label{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.06em;padding:0 8px;margin-bottom:8px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:background .15s;}
.sb-item:hover{background:rgba(255,255,255,.06);}
.sb-item.active{background:rgba(255,255,255,.12);}
.sb-item.done{opacity:.75;}
.sb-item.done.clickable:hover{opacity:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);}
.sb-item.done .done-num{background:rgba(26,122,70,.25);border-color:rgba(26,122,70,.6);color:#4de89a;}
.sb-step-num{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.4);flex-shrink:0;transition:all .2s;}
.sb-item.active .sb-step-num{border-color:var(--gold);color:var(--gold);background:rgba(184,50,50,.18);}
.sb-item.done .sb-step-num{background:var(--green);border-color:var(--green);color:#fff;}
.sb-step-label{font-size:13px;color:rgba(255,255,255,.5);font-weight:400;}
.sb-item.active .sb-step-label{color:#fff;font-weight:500;}
.sb-item.done .sb-step-label{color:rgba(255,255,255,.6);}
.sb-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);}
.sb-footer-text{font-size:11px;color:rgba(255,255,255,.25);}

/* Main content */
.main-header{background:var(--white);border-bottom:1px solid var(--border);padding:20px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.main-header-left h1{font-family:var(--font-display);font-size:20px;color:var(--navy);font-weight:400;}
.main-header-left p{font-size:13px;color:var(--muted);margin-top:2px;}
.main-body{padding:36px 40px;max-width:720px;}

/* Cards */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:20px;box-shadow:var(--shadow);}
.card-title{font-size:13px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.card-title::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:2px;display:inline-block;}

/* Form elements */
.field{margin-bottom:20px;}
.field:last-child{margin-bottom:0;}
.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:block;}
.field-hint{font-size:12px;color:var(--text-light);margin-top:6px;}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:11px 14px;border-radius:var(--radius);border:1.5px solid var(--border);
  font-size:14px;font-family:var(--font-body);color:var(--text);background:var(--cream);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:var(--navy);background:var(--white);box-shadow:0 0 0 3px rgba(13,31,60,.06);}
textarea{resize:vertical;line-height:1.6;min-height:100px;}

/* Pills */
.pill-group{display:flex;flex-wrap:wrap;gap:8px;}
.pill{padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--muted);font-family:var(--font-body);transition:all .15s;font-weight:400;}
.pill:hover{border-color:var(--navy);color:var(--navy);}
.pill.on{border-color:var(--navy);background:var(--navy);color:#fff;}

/* Radio */
.radio-group{display:flex;flex-direction:column;gap:8px;}
.radio-opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;background:var(--white);}
.radio-opt:hover{border-color:var(--navy);background:var(--cream);}
.radio-opt.on{border-color:var(--navy);background:#f0f4fa;}
.radio-circle{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.radio-opt.on .radio-circle{border-color:var(--navy);background:var(--navy);}
.radio-inner{width:6px;height:6px;border-radius:50%;background:#fff;display:none;}
.radio-opt.on .radio-circle .radio-inner{display:block;}
.radio-label{font-size:14px;color:var(--muted);}
.radio-opt.on .radio-label{color:var(--navy);font-weight:500;}

/* Buttons */
.btn-primary{padding:12px 28px;border-radius:var(--radius);border:none;background:var(--navy);color:#fff;font-size:14px;font-family:var(--font-body);font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px;}
.btn-primary:hover{background:var(--navy-light);transform:translateY(-1px);box-shadow:var(--shadow);}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none;box-shadow:none;}
.btn-secondary{padding:11px 24px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--white);color:var(--navy);font-size:14px;font-family:var(--font-body);font-weight:500;cursor:pointer;transition:all .15s;}
.btn-secondary:hover{border-color:var(--navy);background:var(--cream);}
.btn-ghost{padding:8px 16px;border-radius:var(--radius);border:1.5px dashed var(--gold);background:var(--gold-light);color:#7a1a1a;font-size:13px;font-family:var(--font-body);font-weight:500;cursor:pointer;transition:all .15s;}
.btn-ghost:hover{background:#eedea0;}
.btn-sm{padding:8px 16px;font-size:13px;}

/* Footer nav */
.step-footer{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:24px;border-top:1px solid var(--border);}

/* Warning */
.warn-box{padding:12px 16px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);font-size:13px;color:#7a4a08;margin-top:16px;display:flex;gap:8px;align-items:flex-start;}

/* Tool blocks */
.tool-block{background:var(--cream);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:14px;transition:border-color .15s;}
.tool-block:hover{border-color:var(--border-strong);}
.tool-block-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.tool-num-badge{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:3px 10px;}
.btn-remove{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s;}
.btn-remove:hover{background:var(--red-bg);color:var(--red);}
.tool-grid{display:grid;grid-template-columns:1fr 140px;gap:12px;margin-bottom:14px;}
.dollar-wrap{position:relative;display:flex;align-items:center;}
.dollar-sign{position:absolute;left:13px;font-size:14px;color:var(--muted);pointer-events:none;z-index:1;font-weight:500;}
.dollar-wrap input{padding-left:28px;}
.btn-add-tool{width:100%;padding:12px;border-radius:var(--radius-lg);border:2px dashed var(--border);background:transparent;color:var(--muted);font-size:13px;font-family:var(--font-body);cursor:pointer;transition:all .15s;margin-bottom:16px;}
.btn-add-tool:hover{border-color:var(--navy);color:var(--navy);background:var(--cream);}

/* Spend bar */
.spend-bar{background:var(--navy);border-radius:var(--radius);padding:16px 20px;display:none;justify-content:space-between;align-items:center;margin-top:4px;}
.spend-bar.show{display:flex;}
.spend-bar-label{font-size:12px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em;}
.spend-bar-val{font-family:var(--font-display);font-size:22px;color:#fff;}

/* Detection cards */
.detect-option{border:2px solid var(--border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;background:var(--white);margin-bottom:12px;transition:all .2s;}
.detect-option:hover{border-color:var(--navy);box-shadow:var(--shadow);}
.detect-option.on{border-color:var(--navy);background:#f0f4fa;box-shadow:0 0 0 3px rgba(13,31,60,.06);}
.detect-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin-bottom:10px;letter-spacing:.03em;}
.detect-title{font-size:15px;font-weight:600;color:var(--navy);margin-bottom:5px;}
.detect-desc{font-size:13px;color:var(--muted);line-height:1.6;}
.detect-inner{margin-top:16px;}
.priv-note{font-size:12px;color:var(--text-light);background:var(--cream);border:1px solid var(--border);padding:10px 14px;border-radius:8px;margin-top:10px;line-height:1.5;}
.det-item{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:8px;margin-bottom:8px;}
.det-name{font-size:14px;font-weight:500;color:var(--navy);}
.det-note{font-size:12px;color:var(--muted);margin-left:8px;}
.det-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.det-cost{font-size:13px;font-weight:600;color:var(--navy);}
.det-conf{font-size:11px;font-weight:600;}

/* Detect overlay */
#detect-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,40,.9);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
#detect-overlay.show{display:flex;}
.detect-modal{background:var(--white);border-radius:var(--radius-xl);padding:40px;width:440px;max-width:92vw;text-align:center;box-shadow:var(--shadow-lg);}
.detect-modal-icon{width:56px;height:56px;background:var(--navy);border-radius:16px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;}
.detect-modal-title{font-family:var(--font-display);font-size:22px;color:var(--navy);margin-bottom:8px;}
.detect-modal-sub{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.dpo-pct{font-size:32px;font-weight:300;font-family:var(--font-display);color:var(--navy);margin-bottom:12px;}
.dpo-wrap{background:var(--border);border-radius:8px;height:6px;overflow:hidden;margin-bottom:10px;}
.dpo-bar{height:6px;border-radius:8px;background:var(--navy);width:0%;transition:width .5s ease;}
.dpo-bar.done{background:var(--green);}
.dpo-msg{font-size:13px;color:var(--muted);min-height:20px;}

/* Success banner */
.success-banner{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--radius);margin-bottom:20px;}
.success-icon{width:28px;height:28px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:14px;font-weight:700;}
.success-text{font-size:13px;color:#0a5c30;font-weight:500;}
.success-sub{font-size:12px;color:#1a7a46;margin-top:2px;}

/* Report */
.report-hero{background:var(--navy);padding:32px 40px;color:#fff;}
.report-hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.report-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:6px;}
.report-firm{font-family:var(--font-display);font-size:26px;color:#fff;font-weight:400;}
.report-meta{font-size:13px;color:rgba(255,255,255,.5);margin-top:4px;}
.risk-pill{padding:6px 18px;border-radius:20px;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;}
.report-summary{font-size:14px;color:rgba(255,255,255,.65);line-height:1.7;max-width:580px;}
.metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px 40px;background:var(--white);border-bottom:1px solid var(--border);}
.metric{background:var(--cream);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;}
.metric-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px;font-weight:600;}
.metric-value{font-family:var(--font-display);font-size:28px;font-weight:400;}
.metric-sub{font-size:12px;color:var(--text-light);margin-top:4px;}

/* Report tabs */
.report-tabs{background:var(--white);border-bottom:1px solid var(--border);padding:0 40px;display:flex;gap:0;overflow-x:auto;}
.report-tab{padding:14px 20px;background:none;border:none;cursor:pointer;font-size:13px;font-family:var(--font-body);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500;transition:all .15s;}
.report-tab:hover{color:var(--navy);}
.report-tab.on{color:var(--navy);font-weight:600;border-bottom-color:var(--navy);}
.report-body{padding:32px 40px;max-width:800px;}

/* Finding cards */
.finding{display:flex;gap:16px;align-items:flex-start;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow);}
.finding-num{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.finding-text{font-size:14px;color:var(--text);line-height:1.6;}

/* Rec cards */
.rec{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow);}
.rec-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.rec-title{font-size:15px;font-weight:600;color:var(--navy);}
.pri-tag{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;flex-shrink:0;margin-left:12px;}
.rec-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:10px;}
.rec-impact{font-size:12px;color:var(--green);font-weight:500;display:flex;align-items:center;gap:6px;}

/* Policy */
.policy-section{margin-bottom:0;}
.policy-toolbar{display:flex;justify-content:flex-end;margin-bottom:20px;}
.policy-body{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow);}
.policy-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);margin:24px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.policy-h:first-child{margin-top:0;}
.policy-p{font-size:14px;color:#3a3530;line-height:1.8;margin-bottom:10px;}
.generate-prompt{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-xl);padding:40px;text-align:center;box-shadow:var(--shadow);}
.generate-prompt-icon{width:52px;height:52px;background:var(--navy);border-radius:14px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
.generate-prompt h3{font-family:var(--font-display);font-size:20px;color:var(--navy);margin-bottom:8px;font-weight:400;}
.generate-prompt p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6;max-width:400px;margin-left:auto;margin-right:auto;}

/* Training */
.train-progress{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow);}
.train-progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.train-progress-title{font-size:14px;font-weight:600;color:var(--navy);}
.train-progress-pct{font-family:var(--font-display);font-size:20px;color:var(--navy);}
.train-pb-wrap{background:var(--border);border-radius:6px;height:8px;overflow:hidden;margin-bottom:8px;}
.train-pb{height:8px;border-radius:6px;background:var(--navy);transition:width .5s;}
.train-pb.complete{background:var(--green);}
.train-sub{font-size:12px;color:var(--muted);}
.mod-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s;}
.mod-card:hover{box-shadow:var(--shadow-lg);}
.mod-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;cursor:pointer;transition:background .15s;}
.mod-header:hover{background:var(--cream);}
.mod-header-left{display:flex;align-items:center;gap:14px;}
.mod-icon{width:38px;height:38px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mod-icon-letter{font-size:16px;font-weight:700;color:#fff;font-family:var(--font-display);}
.mod-info{}
.mod-name{font-size:15px;font-weight:600;color:var(--navy);}
.mod-status-text{font-size:12px;color:var(--muted);margin-top:2px;}
.mod-header-right{display:flex;align-items:center;gap:10px;}
.status-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;}
.mod-chevron{font-size:12px;color:var(--muted);transition:transform .2s;}
.mod-chevron.open{transform:rotate(180deg);}
.mod-body{border-top:1px solid var(--border);padding:24px;}
.mod-section{margin-bottom:20px;}
.mod-section:last-child{margin-bottom:0;}
.mod-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px;}
.mod-text{font-size:14px;color:var(--text);line-height:1.7;}
.mod-list{font-size:14px;color:var(--text);line-height:1.7;padding-left:20px;}
.mod-list li{margin-bottom:5px;}
.mod-list.prohibited li{color:var(--red);}
.compliance-note{display:flex;gap:10px;padding:12px 16px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);margin-bottom:20px;}
.compliance-note-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7a4a08;flex-shrink:0;padding-top:1px;}
.compliance-note-text{font-size:13px;color:#7a4a08;line-height:1.6;}

/* Quiz */
.quiz-section{background:var(--cream);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-top:20px;}
.quiz-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.quiz-badge{padding:3px 10px;background:var(--navy);color:#fff;border-radius:20px;font-size:11px;font-weight:600;}
.q-item{margin-bottom:20px;}
.q-text{font-size:14px;font-weight:500;color:var(--navy);margin-bottom:10px;line-height:1.5;}
.q-opt{display:flex;align-items:flex-start;gap:12px;padding:11px 16px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;margin-bottom:8px;background:var(--white);transition:all .15s;font-size:13px;color:var(--text);line-height:1.5;}
.q-opt:hover{border-color:var(--navy);background:var(--cream);}
.q-opt.selected{border-color:var(--navy);background:#f0f4fa;}
.q-opt.correct{border-color:var(--green);background:var(--green-bg);color:#0a5c30;}
.q-opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);}
.q-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;transition:all .15s;}
.q-opt.selected .q-dot{border-color:var(--navy);background:var(--navy);}
.q-opt.correct .q-dot{border-color:var(--green);background:var(--green);}
.q-opt.wrong .q-dot{border-color:var(--red);background:var(--red);}
.q-explanation{font-size:12px;color:var(--green);margin-top:6px;padding-left:28px;font-weight:500;}
.quiz-result{text-align:center;padding:24px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);margin-top:16px;}
.quiz-score{font-family:var(--font-display);font-size:44px;color:var(--navy);margin-bottom:6px;}
.quiz-pass{color:var(--green);font-size:14px;font-weight:600;margin-bottom:4px;}
.quiz-fail{color:var(--red);font-size:14px;font-weight:600;margin-bottom:4px;}
.quiz-sub{font-size:13px;color:var(--muted);}

/* Certificate */
.cert-outer{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-xl);padding:40px;box-shadow:var(--shadow-lg);margin-bottom:20px;}
.cert-inner{border:2px solid var(--navy);border-radius:var(--radius-lg);padding:40px;text-align:center;position:relative;}
.cert-corner{position:absolute;width:16px;height:16px;border:3px solid var(--gold);}
.cert-corner.tl{top:10px;left:10px;border-right:none;border-bottom:none;}
.cert-corner.tr{top:10px;right:10px;border-left:none;border-bottom:none;}
.cert-corner.bl{bottom:10px;left:10px;border-right:none;border-top:none;}
.cert-corner.br{bottom:10px;right:10px;border-left:none;border-top:none;}
.cert-seal{width:64px;height:64px;background:var(--navy);border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;border:3px solid var(--gold);}
.cert-seal-text{color:#fff;font-size:9px;font-weight:700;letter-spacing:.06em;text-align:center;line-height:1.4;text-transform:uppercase;}
.cert-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.cert-sub{font-size:13px;color:var(--muted);margin-bottom:12px;}
.cert-name-input{border:none;border-bottom:2px solid var(--border);border-radius:0;text-align:center;font-family:var(--font-display);font-size:26px;color:var(--navy);padding:4px 0;background:transparent;width:100%;max-width:400px;margin-bottom:8px;}
.cert-name-input:focus{outline:none;border-bottom-color:var(--navy);}
.cert-firm{font-family:var(--font-display);font-size:20px;color:var(--navy);margin-bottom:16px;}
.cert-body{font-size:13px;color:var(--muted);line-height:1.8;max-width:480px;margin:0 auto 20px;}
.cert-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0;}
.cert-tool{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;background:var(--green-bg);color:#085041;border:1px solid var(--green-border);}
.cert-date{font-size:12px;color:var(--text-light);margin-top:16px;}

/* Training loading */
.train-loading{padding:20px 0;}
.train-load-header{margin-bottom:20px;}
.train-load-title{font-family:var(--font-display);font-size:20px;color:var(--navy);margin-bottom:6px;}
.train-load-sub{font-size:13px;color:var(--muted);}
.train-load-pb-wrap{background:var(--border);border-radius:6px;height:8px;overflow:hidden;margin:12px 0 6px;}
.train-load-pb{height:8px;border-radius:6px;background:var(--navy);transition:width .5s;}
.train-load-pct{font-size:13px;color:var(--muted);text-align:right;margin-bottom:20px;}
.train-done-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--radius);margin-bottom:8px;}
.train-done-check{width:22px;height:22px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:12px;font-weight:700;}
.train-done-name{font-size:14px;color:#0a5c30;font-weight:500;}
.train-curr-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--cream);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
.mini-spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--navy);animation:spin .8s linear infinite;flex-shrink:0;}
.train-curr-name{font-size:14px;color:var(--muted);}

/* Review */
.review-table{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.review-row{display:flex;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);}
.review-row:last-child{border-bottom:none;}
.review-row:nth-child(even){background:var(--cream);}
.review-key{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:160px;padding-top:2px;}
.review-val{font-size:14px;color:var(--text);flex:1;line-height:1.5;}

/* Spinner */
.spin-full{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--navy);animation:spin .8s linear infinite;}
.spin-text{font-size:14px;color:var(--muted);}

/* Fade in */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeIn .25s ease forwards;}

/* Step header */
.step-eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:6px;}
.step-title{font-family:var(--font-display);font-size:26px;color:var(--navy);font-weight:400;margin-bottom:6px;}
.step-desc{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px;}
.dash-grid.three{grid-template-columns:repeat(3,1fr);}
.dash-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;box-shadow:var(--shadow);}
.dash-card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.health-score{font-family:var(--font-display);font-size:56px;font-weight:400;line-height:1;margin-bottom:6px;}
.health-label{font-size:13px;font-weight:600;margin-bottom:4px;}
.health-sub{font-size:12px;color:var(--muted);}
.health-bar-wrap{background:var(--border);border-radius:6px;height:8px;overflow:hidden;margin:12px 0 8px;}
.health-bar{height:8px;border-radius:6px;transition:width .8s ease;}
.score-breakdown{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.score-item{display:flex;justify-content:space-between;align-items:center;font-size:12px;}
.score-item-label{color:var(--muted);}
.score-item-val{font-weight:600;}
.staff-list{display:flex;flex-direction:column;gap:8px;}
.staff-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);}
.staff-name{font-size:13px;font-weight:500;color:var(--navy);}
.staff-role{font-size:12px;color:var(--muted);}
.staff-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
.alert-list{display:flex;flex-direction:column;gap:10px;}
.alert-item{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--white);}
.alert-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.alert-content{flex:1;}
.alert-title{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:3px;}
.alert-desc{font-size:12px;color:var(--muted);line-height:1.5;}
.alert-date{font-size:11px;color:var(--text-light);margin-top:4px;}
.alert-action{font-size:12px;font-weight:600;color:var(--navy);text-decoration:underline;cursor:pointer;margin-top:6px;display:inline-block;}
.policy-version{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);}
.policy-version-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.policy-version-title{font-size:15px;font-weight:600;color:var(--navy);}
.policy-version-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.version-history{display:flex;flex-direction:column;gap:8px;}
.version-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
.version-item:last-child{border-bottom:none;}
.version-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.version-info{flex:1;}
.version-label{font-size:13px;font-weight:500;color:var(--navy);}
.version-date{font-size:12px;color:var(--muted);margin-top:2px;}
.version-change{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
.renewal-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.renewal-item:last-child{border-bottom:none;}
.renewal-name{font-size:13px;font-weight:500;color:var(--navy);}
.renewal-date{font-size:12px;color:var(--muted);margin-top:2px;}
.renewal-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
.update-notif{background:linear-gradient(135deg,#111111,#2C2C2C);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:16px;display:flex;gap:16px;align-items:center;}
.update-notif-icon{width:44px;height:44px;background:rgba(255,255,255,.1);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;}
.update-notif-content{flex:1;}
.update-notif-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px;}
.update-notif-desc{font-size:12px;color:rgba(255,255,255,.65);line-height:1.5;}
.update-notif-btn{padding:8px 16px;border-radius:8px;background:var(--gold);color:#fff;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:var(--font-body);white-space:nowrap;flex-shrink:0;}

.lookup-result{background:var(--cream);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:10px;}
.lookup-result-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.lookup-tool-name{font-size:14px;font-weight:600;color:var(--navy);}
.lookup-cat{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--blue-bg);color:var(--blue);flex-shrink:0;margin-left:8px;}
.lookup-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.lookup-meta{font-size:12px;color:var(--muted);margin-bottom:4px;}
.lookup-meta b{color:var(--navy);}
.lookup-risk-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.lookup-risk-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
.lookup-spin-row{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;color:var(--muted);}
.lk-spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--navy);animation:spin .8s linear infinite;flex-shrink:0;}

/* Staff view */
.staff-view-overlay{position:fixed;inset:0;background:#111;z-index:9999;display:flex;flex-direction:column;overflow-y:auto;animation:fadeIn .2s ease;}
.staff-view-header{background:#111;border-bottom:1px solid #333;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.staff-view-brand{font-family:var(--font-display);font-size:18px;color:#fff;}
.staff-view-firm{font-size:13px;color:#888;}
.staff-close-btn{padding:8px 18px;border-radius:8px;background:#333;color:#fff;border:none;font-size:13px;cursor:pointer;font-family:var(--font-body);}
.staff-view-body{max-width:760px;margin:0 auto;padding:40px 24px;width:100%;}
.staff-welcome{margin-bottom:32px;}
.staff-welcome h2{font-family:var(--font-display);font-size:28px;color:#fff;margin-bottom:8px;}
.staff-welcome p{font-size:15px;color:#aaa;line-height:1.7;}
.staff-name-section{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:24px;margin-bottom:24px;}
.staff-name-section label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#888;display:block;margin-bottom:8px;}
.staff-name-input{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-size:15px;font-family:var(--font-body);outline:none;}
.staff-name-input:focus{border-color:#B83232;}
.staff-policy-section{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:24px;margin-bottom:24px;}
.staff-policy-section h3{font-size:16px;font-weight:600;color:#fff;margin-bottom:4px;}
.staff-policy-meta{font-size:12px;color:#888;margin-bottom:16px;}
.staff-policy-text{font-size:13px;color:#ccc;line-height:1.8;max-height:300px;overflow-y:auto;border:1px solid #333;border-radius:8px;padding:16px;background:#111;}
.staff-policy-text h2{font-size:14px;font-weight:700;color:#fff;margin:16px 0 8px;text-transform:none;}
.staff-module-list{display:flex;flex-direction:column;gap:16px;margin-bottom:32px;}
.staff-module-card{background:#1a1a1a;border:1px solid #333;border-radius:12px;overflow:hidden;}
.staff-module-header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.staff-module-header:hover{background:#222;}
.staff-module-name{font-size:15px;font-weight:600;color:#fff;}
.staff-module-status{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;}
.staff-module-body{padding:0 20px 20px;border-top:1px solid #333;animation:fadeIn .15s ease;}
.staff-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#666;margin:16px 0 8px;}
.staff-list-item{font-size:13px;color:#ccc;padding:6px 0;border-bottom:1px solid #222;display:flex;gap:10px;}
.staff-list-item::before{content:'→';color:#B83232;flex-shrink:0;}
.staff-quiz-q{background:#111;border-radius:8px;padding:16px;margin-bottom:12px;}
.staff-quiz-q-text{font-size:14px;font-weight:500;color:#fff;margin-bottom:12px;}
.staff-quiz-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid #333;margin-bottom:8px;cursor:pointer;font-size:14px;color:#ccc;transition:all .15s;line-height:1.5;}
.staff-quiz-opt:hover{border-color:#555;background:#222;}
.staff-quiz-opt.selected{border-color:#B83232;background:rgba(184,50,50,.1);color:#fff;}
.staff-quiz-opt.correct{border-color:#1A7A46;background:rgba(26,122,70,.15);color:#4de89a;}
.staff-quiz-opt.wrong{border-color:#B83232;background:rgba(184,50,50,.15);color:#f08080;}
.staff-quiz-submit{display:block;width:100%;padding:13px 24px;border-radius:10px;background:#B83232;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);margin-top:16px;transition:all .15s;}
.staff-quiz-submit:hover{background:#991f1f;transform:translateY(-1px);}
.staff-quiz-result{padding:14px 16px;border-radius:8px;margin-top:12px;font-size:14px;font-weight:500;}
.staff-cert-section{background:linear-gradient(135deg,#1a1a1a,#222);border:1px solid #444;border-radius:12px;padding:32px;text-align:center;margin-bottom:32px;}
.staff-cert-title{font-family:var(--font-display);font-size:24px;color:#fff;margin-bottom:8px;}
.staff-cert-sub{font-size:14px;color:#888;margin-bottom:20px;}
.staff-cert-print{padding:12px 28px;border-radius:8px;background:#B83232;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);}

.sb-item.done{transition:background .15s;}
.sb-item.done:hover{background:rgba(0,0,0,.04);}
.tool-search-wrap{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.tool-search-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px;}
.tool-search-input-row{display:flex;gap:8px;align-items:center;}
.tool-search-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font-body);color:var(--text);background:var(--white);outline:none;transition:border .15s;}
.tool-search-input:focus{border-color:var(--navy);}
.tool-search-btn{padding:10px 18px;border-radius:8px;background:var(--navy);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);white-space:nowrap;transition:all .15s;}
.tool-search-btn:hover{background:var(--navy-light);}
.tool-search-btn:disabled{opacity:.4;cursor:default;}
.search-result-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.search-result-item{padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;transition:all .15s;}
.search-result-item:hover{border-color:var(--navy);background:var(--cream);}
.search-result-item.added{border-color:var(--green);background:var(--green-bg);}
.search-result-name{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:3px;}
.search-result-meta{font-size:12px;color:var(--muted);line-height:1.5;}
.search-result-risk{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-top:6px;}
.search-result-suggestion{background:var(--cream);border-style:dashed;}
.search-result-suggestion .search-result-name{color:var(--muted);}
.search-no-result{padding:12px 14px;border:1px dashed var(--border);border-radius:8px;font-size:13px;color:var(--muted);text-align:center;}
.search-spin-row{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:13px;color:var(--muted);}
.search-spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--navy);animation:spin .8s linear infinite;flex-shrink:0;}

.cl-search-wrap{position:relative;margin-bottom:20px;}
.cl-search-input{width:100%;padding:11px 44px 11px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-family:var(--font-body);font-size:14px;color:var(--navy);outline:none;transition:border-color .15s;box-sizing:border-box;}
.cl-search-input:focus{border-color:var(--navy);}
.cl-search-icon{display:none;}
.cl-search-spin{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--navy);animation:spin .7s linear infinite;}
.cl-search-spinner-fixed{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--navy);animation:spin .7s linear infinite;}
.cl-search-result{background:var(--white);border:1.5px solid var(--green);border-radius:12px;padding:18px 20px;margin-bottom:16px;animation:fadeIn .2s ease;}
.cl-result-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.cl-result-name{font-size:16px;font-weight:700;color:var(--navy);}
.cl-result-cat{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--green-bg);color:var(--green);}
.cl-result-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px;}
.cl-result-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.cl-result-meta-item{font-size:12px;color:var(--muted);line-height:1.5;}
.cl-result-meta-item b{color:var(--navy);}
.cl-risk-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.cl-risk-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
.cl-add-btn{padding:10px 20px;border-radius:8px;background:var(--navy);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);transition:all .15s;}
.cl-add-btn:hover{background:var(--navy-light);transform:translateY(-1px);}
.cl-suggestions{margin-bottom:16px;animation:fadeIn .2s ease;}

var API_HDR={'Content-Type':'application/json','anthropic-version':'2023-06-01'};
var API_MODEL='claude-sonnet-4-20250514';
var API_URL='https://api.anthropic.com/v1/messages';

async function _apiFetch(body){
  var res=await fetch(API_URL,{method:'POST',headers:API_HDR,body:JSON.stringify(body)});
  var data=await res.json();
  if(!res.ok||!data.content){throw new Error('API '+res.status+': '+(data&&data.error&&data.error.message||JSON.stringify(data).slice(0,120)));}
  if(data.stop_reason==='max_tokens'){throw new Error('Response truncated — max_tokens limit reached. Try again.');}
  return data;
}

// Plain text call (policy generation, free-form responses)
async function callClaude(prompt,maxT){
  var data=await _apiFetch({model:API_MODEL,max_tokens:maxT||2000,messages:[{role:'user',content:prompt}]});
  var block=data.content.find(function(b){return b.type==='text';});
  return block?block.text:'';
}

// JSON call — strong system prompt forces clean JSON
async function callClaudeJSON(systemPrompt,userPrompt,maxT){
  var sys=(systemPrompt||'')+'\n\nCRITICAL OUTPUT RULES:\n1. Your entire response must be a single valid JSON object.\n2. Start your response with { and end with }.\n3. Do NOT include markdown fences, backticks, or any text outside the JSON.\n4. Do NOT use smart quotes — use only straight double quotes inside JSON strings.\n5. Do NOT use apostrophes or contractions inside JSON string values — write them out in full (e.g. "do not" not "don\'t").\n6. Keep each string value CONCISE (under 25 words) to stay within token limits.\n7. Every string value must be properly escaped — no bare double quotes inside values.';
  var data=await _apiFetch({model:API_MODEL,max_tokens:maxT||3000,system:sys,messages:[{role:'user',content:userPrompt}]});
  var block=data.content.find(function(b){return b.type==='text';});
  return block?block.text:'';
}

// Robust JSON parser — handles the most common LLM JSON quirks
function parseJSON(raw){
  if(!raw)return null;
  var s=raw.trim();
  // Strip markdown fences
  s=s.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
  // Extract outermost JSON object
  var a=s.indexOf('{'),z=s.lastIndexOf('}');
  if(a>-1&&z>a)s=s.slice(a,z+1);
  // Normalise smart/curly quotes to straight quotes
  s=s.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"');
  // Remove stray control characters
  s=s.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
  // Attempt 1: direct parse
  try{return JSON.parse(s);}catch(e1){}
  // Attempt 2: fix unescaped newlines inside string values
  try{
    var fixed=s.replace(/"((?:[^"\\]|\\.)*)"/g,function(m,inner){
      return '"'+inner.replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t')+'"';
    });
    return JSON.parse(fixed);
  }catch(e2){}
  // Attempt 3: strip trailing commas before } or ]
  try{
    var fixed2=s.replace(/,\s*([}\]])/g,'$1');
    return JSON.parse(fixed2);
  }catch(e3){}
  console.error('parseJSON failed. Raw (first 400 chars):', s.slice(0,400));
  return null;
}

function autoSuggestRisk(){
  var hints=S.toolSearchHints||{};
  var allHints=Object.values(hints);
  if(!allHints.length)return;
  // clientData: if any tool processes client data → suggest 'Possibly — we paste content in'
  var anyClientData=allHints.some(function(h){return h.processesClientData;});
  var allAU=allHints.every(function(h){return h.storageRegion==='Australia';});
  var anyOverseas=allHints.some(function(h){return h.storageRegion&&h.storageRegion!=='Australia'&&h.storageRegion!=='Unknown';});
  var updates={};
  if(anyClientData&&!S.clientData)updates.clientData='Possibly — we paste content in';
  if(allAU&&!S.dataStorage)updates.dataStorage='Australia only';
  else if(anyOverseas&&!S.dataStorage)updates.dataStorage='Overseas servers';
  if(Object.keys(updates).length)ss(updates);
}

function applyDetected(){
  var merged=S.detected.map(function(t){return{name:t.name,cost:String(t.estimatedMonthly||''),useCase:''};});
  S.checklist.forEach(function(c){if(!S.detected.find(function(d){return d.name===c;}))merged.push({name:c,cost:'',useCase:''});});
  // Pre-populate toolLookups from any search results stored in toolSearchHints
  var hints=S.toolSearchHints||{};
  var lookups=Object.assign({},S.toolLookups||{});
  merged.forEach(function(tool,i){
    if(hints[tool.name]&&!lookups[i]){
      lookups[i]={status:'done',data:hints[tool.name]};
    }
  });
  ss({tools:merged.length?merged:[{name:'',cost:'',useCase:''}],toolLookups:lookups,step:2,checklistSearch:'',checklistSuggestions:[],checklistSearchResult:null});
}

function el(tag,props,kids){
  var e=document.createElement(tag);
  if(props)Object.keys(props).forEach(function(k){
    if(k==='cls')e.className=props[k];
    else if(k.substr(0,2)==='on')e.addEventListener(k.substr(2),props[k]);
    else if(k==='sty')Object.assign(e.style,props[k]);
    else e.setAttribute(k,props[k]);
  });
  if(kids)(Array.isArray(kids)?kids:[kids]).forEach(function(c){
    if(c==null||c===false)return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

function updateSidebar(){
  var firmDiv=document.getElementById('sb-firm');
  var firmName=document.getElementById('sb-firm-name');
  if(firmDiv&&firmName){
    if(S.firmName){firmDiv.style.display='block';firmName.textContent=S.firmName;}
    else firmDiv.style.display='none';
  }
  var steps=document.getElementById('sb-steps');
  if(!steps)return;
  steps.innerHTML='';
  var maxStep=S.step===6?5:S.step;
  STEPS.forEach(function(s,i){
    var isDone=i<maxStep||(S.step===6&&i<=5);
    var isActive=i===maxStep&&S.step!==6;
    var cls='sb-item';
    if(isActive)cls+=' active';
    else if(isDone)cls+=' done clickable';
    var item=el('div',{cls:cls});
    if(isDone){
      item.style.cursor='pointer';
      item.title='Click to go back and edit '+s;
      (function(idx2){item.addEventListener('click',function(){
        if(S.staffViewOpen)ss({staffViewOpen:false});
        ss({step:idx2});
      });})(i);
    }
    var num=el('div',{cls:'sb-step-num'+(isDone?' done-num':'')});
    if(isDone)num.innerHTML='<span style="color:#4de89a;font-size:12px">✓</span>';
    else num.textContent=String(i+1);
    item.appendChild(num);
    var lw=el('div',{sty:{display:'flex',flexDirection:'column',gap:'1px',minWidth:0}});
    lw.appendChild(el('span',{cls:'sb-step-label'},s));
    if(isDone){var eh=el('span',{sty:{fontSize:'10px',color:'rgba(255,255,255,.3)'}});eh.textContent='edit';lw.appendChild(eh);}
    item.appendChild(lw);
    steps.appendChild(item);
  });
  if(S.step===6){
    var nt=el('div',{sty:{padding:'10px 12px',marginTop:'8px',borderRadius:'8px',background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.07)',fontSize:'11px',color:'rgba(255,255,255,.3)',lineHeight:'1.5'}});
    nt.textContent='Click any step above to edit your answers.';
    steps.appendChild(nt);
  }
}

function calcHealthScore(){
  var score=0;var max=0;
  // Risk level
  max+=25;if(S.report){if(S.report.riskLevel==='Low')score+=25;else if(S.report.riskLevel==='Medium')score+=15;else score+=5;}
  // Has policy
  max+=20;if(S.hasPolicy==='Yes, a formal one')score+=20;else if(S.hasPolicy==='Informal guidelines only'||S.hasPolicy==='In progress')score+=10;
  // Has training
  max+=20;if(S.hasTraining==='Yes, formal training')score+=20;else if(S.hasTraining==='Some staff have')score+=10;
  // Training modules completed
  max+=20;var passed=countPassed();var total=S.modules.length;if(total>0)score+=Math.round((passed/total)*20);
  // Data storage
  max+=15;if(S.dataStorage==='Australia only')score+=15;else if(S.dataStorage==='Mixture')score+=8;
  return Math.round((score/max)*100);
}


function staffQuizPass(mi){
  var mod=S.modules[mi];if(!mod||!mod.quiz)return false;
  var ans=S.staffQuizAnswers[mi]||{};
  var correct=mod.quiz.filter(function(q,qi){return ans[qi]===q.correct;}).length;
  return correct>=Math.ceil(mod.quiz.length*0.8);
}

      sSpin.style.display='none';
      searchWrap.appendChild(sSpin);
      ci.appendChild(searchWrap);

      // Results container — written to directly, never rebuilt by render()
      var sResults=el('div',{cls:'cl-results-container'});
      sResults.addEventListener('click',function(e){e.stopPropagation();});

      // Helper: render a found tool card into the results container
      function showFoundCard(sr){
        sResults.innerHTML='';
        var sCard=el('div',{cls:'cl-search-result'});
        var sHdr=el('div',{cls:'cl-result-header'});
        sHdr.appendChild(el('div',{cls:'cl-result-name'},sr.name||'Tool found'));
        sHdr.appendChild(el('span',{cls:'cl-result-cat'},sr.category||'AI Tool'));
        sCard.appendChild(sHdr);
        if(sr.vendor){var vp=el('div',{sty:{fontSize:'12px',color:'var(--muted)',marginBottom:'6px'}});vp.textContent='By '+sr.vendor;sCard.appendChild(vp);}
        if(sr.description){var dp=el('div',{cls:'cl-result-desc',sty:{marginBottom:'0'}});dp.textContent=sr.description;sCard.appendChild(dp);}
        var alreadyIn=S.checklist.indexOf(sr.name)>-1;
        var addBtn=el('button',{cls:'cl-add-btn'});
        addBtn.textContent=alreadyIn?'✓ Already added':'+ Add to selection';
        if(alreadyIn)addBtn.style.background='var(--green)';
        addBtn.addEventListener('click',function(e){
          e.stopPropagation();
          if(!alreadyIn){
            var hints=Object.assign({},S.toolSearchHints||{});hints[sr.name]=sr;
            addBtn.textContent='✓ Added';addBtn.style.background='var(--green)';
            alreadyIn=true;
            // ss() here is fine — user took an action, re-render expected
            ss({checklist:tog(S.checklist,sr.name),toolSearchHints:hints});
          }
        });
        sCard.appendChild(addBtn);
        sResults.appendChild(sCard);
      }

      // Helper: render suggestions
      function showSuggestions(suggestions){
        sResults.innerHTML='';
        if(!suggestions.length)return;
        var sw=el('div',{cls:'cl-suggestions'});
        sw.appendChild(el('div',{cls:'cl-sugg-label'},'Did you mean one of these?'));
        var pr=el('div',{cls:'cl-sugg-pills'});
        suggestions.forEach(function(name){
          var sp=el('button',{cls:'cl-sugg-pill'});
          sp.textContent=name;
          var already=S.checklist.indexOf(name)>-1;
          if(already){sp.style.background='var(--green-bg)';sp.style.borderColor='var(--green)';sp.style.color='var(--green)';}
          sp.addEventListener('click',function(e){
            e.stopPropagation();
            sInput.value='';S.checklistSearch='';sResults.innerHTML='';
            ss({checklist:tog(S.checklist,name),checklistSuggestions:[],checklistSearchResult:null});
          });
          pr.appendChild(sp);
        });
        sw.appendChild(pr);sResults.appendChild(sw);
      }

      // Helper: run the search without ever calling render()
      function doSearch(query){
        if(!query||query.length<2){sResults.innerHTML='';return;}
        sSpin.style.display='block';
        S.checklistSearching=true;
        // Local fuzzy match first
        var q=query.toLowerCase();
        var allTools=TOOL_CATEGORIES.reduce(function(a,c){return a.concat(c.tools);},[]);
        var local=allTools.filter(function(t){
          return t.toLowerCase().indexOf(q)>-1||q.split(' ').some(function(w){return w.length>2&&t.toLowerCase().indexOf(w)>-1;});
        });
        if(local.length>=3){
          sSpin.style.display='none';S.checklistSearching=false;
          S.checklistSuggestions=local.slice(0,8);S.checklistSearchResult=null;
          showSuggestions(S.checklistSuggestions);
          return;
        }
        // Call Claude — write result directly to DOM, NO ss(), NO render()
        var prompt='Search the web to identify what AI or software tool an Australian law firm user is referring to when they type "'+query+'". They may be using a partial name, nickname, or misspelling. Use web search to find the exact product. Examples: "Project Manda" likely refers to a legal project management or AI tool with Manda in the name — search for it. "Harv" likely refers to Harvey AI. Be generous with partial matches. After searching, return ONLY valid JSON with no markdown: {"found":true,"tool":{"name":"exact official product name","vendor":"company name","category":"Legal AI|General AI|Productivity|Communication|Document|Finance|Other","description":"1-2 sentences what it does and who uses it","dataStorage":"where data is stored or processed","australiaCompliance":"brief note on Australian Privacy Act compliance","riskLevel":"Low|Medium|High","riskReason":"one sentence","pricing":"pricing if known or Unknown","dataHandling":"how client or personal data is handled","processesClientData":true,"storageRegion":"Australia|US|EU|Global|Unknown"}} OR if genuinely no match exists: {"found":false,"suggestions":["tools whose name is phonetically or visually similar to what was typed — not generic alternatives"]}';
        callClaudeWithSearch(prompt,1200).then(function(txt){
          sSpin.style.display='none';S.checklistSearching=false;
          try{
            var data=parseJSON(txt)||{};
            if(data.found&&data.tool){
              S.checklistSearchResult=data.tool;S.checklistSuggestions=[];
              var hints=Object.assign({},S.toolSearchHints||{});hints[data.tool.name]=data.tool;
              S.toolSearchHints=hints;
              showFoundCard(data.tool);
            } else {
              var suggs=(data.suggestions||[]).slice(0,8);
              local.forEach(function(l){if(suggs.indexOf(l)<0)suggs.unshift(l);});
              S.checklistSuggestions=suggs.slice(0,8);S.checklistSearchResult=null;
              if(suggs.length>0){showSuggestions(S.checklistSuggestions);}
              else{sResults.innerHTML='<div class="cl-no-result">No tool found matching "'+query+'". Check the spelling or try a different name.</div>';}
            }
          }catch(e){
            sSpin.style.display='none';
            if(local.length){S.checklistSuggestions=local.slice(0,5);showSuggestions(S.checklistSuggestions);}
            else{sResults.innerHTML='<div class="cl-no-result">Could not find that tool. Check the spelling or try a different name.</div>';}
          }
        }).catch(function(){
          sSpin.style.display='none';S.checklistSearching=false;
          sResults.innerHTML='';
        });
      }

      // Restore results from state if re-rendering (e.g. after adding a tool)
      if(S.checklistSearchResult){showFoundCard(S.checklistSearchResult);}
      else if(S.checklistSuggestions.length){showSuggestions(S.checklistSuggestions);}

      // Input handler — purely silent, NEVER calls ss() or render()
      var sTimer=null;
      sInput.addEventListener('input',function(e){
        var val=e.target.value;
        S.checklistSearch=val;
        clearTimeout(sTimer);
        if(!val.trim()){
          sResults.innerHTML='';sSpin.style.display='none';
          S.checklistSuggestions=[];S.checklistSearchResult=null;
          return;
        }
        sTimer=setTimeout(function(){
          if(S.checklistSearch===val)doSearch(val);
        },600);
      });
      sInput.addEventListener('keydown',function(e){e.stopPropagation();});
      sInput.addEventListener('click',function(e){e.stopPropagation();});

      ci.appendChild(sResults);

      // ── Divider before categorised list ───────────────────────────────────
      ci.appendChild(el('div',{sty:{borderTop:'1px solid var(--border)',margin:'4px 0 16px'}}));

      // ── Custom added tools (from search) ──────────────────────────────────
      // Show any checklist items that are NOT in TOOL_CATEGORIES
      var allKnown=TOOL_CATEGORIES.reduce(function(a,c){return a.concat(c.tools);},[]);
      var customAdded=S.checklist.filter(function(t){return allKnown.indexOf(t)<0;});
      if(customAdded.length){
        var caw=el('div',{cls:'cl-added-wrap'});
        caw.appendChild(el('div',{cls:'cl-added-label'},'Added from search ('+customAdded.length+')'));
        var cap=el('div',{cls:'cl-added-pills'});
        customAdded.forEach(function(name){
          var pill=el('div',{cls:'cl-added-pill'});
          pill.appendChild(el('span',{},name));
          var rm=el('button',{cls:'cl-added-pill-remove'});
          rm.textContent='×';
          rm.title='Remove '+name;
          (function(n){rm.addEventListener('click',function(e){
            e.stopPropagation();
            var newList=S.checklist.filter(function(t){return t!==n;});
            ss({checklist:newList});
          });})(name);
          pill.appendChild(rm);
          cap.appendChild(pill);
        });
        caw.appendChild(cap);
        ci.appendChild(caw);
      }

      // ── Categorised tool pills ────────────────────────────────────────────
      TOOL_CATEGORIES.forEach(function(cat){
        var cw=el('div',{sty:{marginBottom:'16px'}});
        cw.appendChild(el('div',{sty:{fontSize:'11px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.07em',color:'var(--muted)',marginBottom:'8px'}},cat.label));
        cw.appendChild(pillGroup(cat.tools,S.checklist,function(v){ss({checklist:tog(S.checklist,v)});}));
        ci.appendChild(cw);
      });

      if(S.checklist.length){
        var clb=el('button',{cls:'btn-primary',sty:{marginTop:'8px'}});
        clb.textContent='Continue with '+S.checklist.length+' tool'+(S.checklist.length>1?'s':'')+' selected';
        clb.addEventListener('click',function(e){e.stopPropagation();applyDetected();});
        ci.appendChild(clb);
      }
      dc2.appendChild(ci);
    }
    mb.appendChild(dc2);

    var dc3=el('div',{cls:'detect-option'+(S.detectMethod==='manual'?' on':''),onclick:function(){ss({detectMethod:'manual'});}});
    dc3.appendChild(el('span',{cls:'detect-badge',sty:{background:'var(--cream)',color:'var(--muted)',border:'1px solid var(--border)'}},'Manual'));
    dc3.appendChild(el('div',{cls:'detect-title'},'Enter tools manually'));
    dc3.appendChild(el('div',{cls:'detect-desc'},'Skip detection and enter your tools directly in the next step.'));
    mb.appendChild(dc3);
  }

  if(stepIdx===2){
    var autoCount=S.detected.length||S.checklist.length;
    if(autoCount>0){
      var sb3=el('div',{cls:'success-banner'});
      var si2=el('div',{cls:'success-icon'});si2.textContent='✓';sb3.appendChild(si2);
      var st=el('div',{});
      st.appendChild(el('div',{cls:'success-text'},autoCount+' tool'+(autoCount>1?'s':'')+' detected automatically'));
      st.appendChild(el('div',{cls:'success-sub'},'Review below, add costs and use cases, then continue'));
      sb3.appendChild(st);mb.appendChild(sb3);
    }
    S.tools.forEach(function(tool,i){
      var tb=el('div',{cls:'tool-block'});
      var tbh=el('div',{cls:'tool-block-header'});
      tbh.appendChild(el('span',{cls:'tool-num-badge'},'Tool '+(i+1)));
      if(S.tools.length>1){var rb2=el('button',{cls:'btn-remove',onclick:function(){var t=S.tools.slice();t.splice(i,1);ss({tools:t});}});rb2.textContent='Remove';tbh.appendChild(rb2);}
      tb.appendChild(tbh);
      var tg=el('div',{cls:'tool-grid'});
      var ni=el('input',{type:'text',placeholder:'Type tool name — unknown tools are looked up automatically',value:tool.name});
      (function(idx){
        ni.addEventListener('input',function(e){S.tools[idx].name=e.target.value;});
        ni.addEventListener('blur',function(){
          var nm=S.tools[idx].name;
          if(nm&&nm.length>2){
            var known=COMMON_TOOLS.some(function(t){return t.toLowerCase()===nm.toLowerCase();});
            var already=S.toolLookups[idx]&&S.toolLookups[idx].data&&(S.toolLookups[idx].data.name||'').toLowerCase()===nm.toLowerCase();
            if(!known&&!already){lookupTool(nm,idx);}else{render();}
          }else{render();}
        });
      })(i);
      var dw=el('div',{cls:'dollar-wrap'});
      dw.appendChild(el('span',{cls:'dollar-sign'},'$'));
      var ci2=el('input',{type:'number',placeholder:'0',value:tool.cost,sty:{paddingLeft:'28px'}});
      (function(idx){ci2.addEventListener('input',function(e){S.tools[idx].cost=e.target.value;var sp2=S.tools.reduce(function(a,t){return a+(parseFloat(t.cost)||0);},0);var sv=document.getElementById('spend-val');var sbel=document.getElementById('spend-bar');if(sv)sv.textContent='$'+sp2.toFixed(0)+'/mo';if(sbel){sbel.className='spend-bar'+(sp2>0?' show':'');}});})(i);
      ci2.addEventListener('blur',function(){render();});
      dw.appendChild(ci2);tg.appendChild(ni);tg.appendChild(dw);tb.appendChild(tg);
      tb.appendChild(el('label',{cls:'field-label',sty:{marginBottom:'8px'}},'Primary use case'));
      tb.appendChild(singlePills(USE_CASES,tool.useCase,function(v){var t=S.tools.map(function(x,j){return j===i?Object.assign({},x,{useCase:v}):x;});ss({tools:t});}));
      (function(li){
        var lk=S.toolLookups[li];
        if(lk&&lk.status==='loading'){
          var ls=el('div',{cls:'lookup-spin-row'});ls.appendChild(el('div',{cls:'lk-spin'}));ls.appendChild(el('span',{},'Looking up '+S.tools[li].name+'...'));tb.appendChild(ls);
        }
        if(lk&&lk.status==='done'&&lk.data&&lk.data.category!=='Unknown'){
          var d=lk.data;
          var lr=el('div',{cls:'lookup-result'});
          var lh=el('div',{cls:'lookup-result-header'});
          lh.appendChild(el('span',{cls:'lookup-tool-name'},d.name||S.tools[li].name));
          lh.appendChild(el('span',{cls:'lookup-cat'},d.category||'AI Tool'));
          lr.appendChild(lh);
          lr.appendChild(el('div',{cls:'lookup-desc'},d.description||''));
          if(d.dataStorage){var m1=el('div',{cls:'lookup-meta'});m1.innerHTML='<b>Data storage:</b> '+d.dataStorage;lr.appendChild(m1);}
          if(d.australiaCompliance){var m2=el('div',{cls:'lookup-meta'});m2.innerHTML='<b>AU compliance:</b> '+d.australiaCompliance;lr.appendChild(m2);}
          if(d.pricing&&d.pricing!=='Unknown'){var m3=el('div',{cls:'lookup-meta'});m3.innerHTML='<b>Pricing:</b> '+d.pricing;lr.appendChild(m3);}
          var rc=d.riskLevel==='High'?'var(--red)':d.riskLevel==='Medium'?'var(--amber)':'var(--green)';
          var rb=d.riskLevel==='High'?'var(--red-bg)':d.riskLevel==='Medium'?'var(--amber-bg)':'var(--green-bg)';
          var rr=el('div',{cls:'lookup-risk-row'});
          rr.appendChild(el('span',{cls:'lookup-risk-badge',sty:{background:rb,color:rc}},(d.riskLevel||'Low')+' risk'));
          rr.appendChild(el('span',{sty:{fontSize:'12px',color:'var(--muted)'}},d.riskReason||''));
          lr.appendChild(rr);
          if(!S.tools[li].useCase&&d.commonUses){var mu=USE_CASES.find(function(u){return d.commonUses.some(function(cu){return cu.toLowerCase().indexOf(u.toLowerCase().split(' ')[0])>-1;});});if(mu)S.tools[li].useCase=mu;}
          tb.appendChild(lr);
        }
        if(lk&&lk.status==='error'){
          var er=el('div',{sty:{fontSize:'12px',color:'var(--muted)',padding:'8px 12px',background:'var(--cream)',borderRadius:'8px',marginTop:'8px'}});er.textContent='Could not find details for this tool — you can still include it.';tb.appendChild(er);
        }
      })(i);
      mb.appendChild(tb);
    });
    mb.appendChild(el('button',{cls:'btn-add-tool',onclick:function(){ss({tools:S.tools.concat([{name:'',cost:'',useCase:''}])});}},'+  Add another tool'));
    var sp3=spend();
    var spbar=el('div',{cls:'spend-bar'+(sp3>0?' show':''),id:'spend-bar'});
    spbar.appendChild(el('div',{cls:'spend-bar-label'},'Total monthly AI spend'));
    spbar.appendChild(el('div',{cls:'spend-bar-val',id:'spend-val'},'$'+sp3.toFixed(0)+'/mo'));
    mb.appendChild(spbar);
  }

  if(stepIdx===3){
    // Show auto-populated hints from tool lookups
    var hints3=S.toolSearchHints||{};
    var hintNames=Object.keys(hints3);
    if(hintNames.length){
      var hintCard=el('div',{cls:'card',sty:{background:'rgba(26,122,70,.05)',border:'1px solid rgba(26,122,70,.2)',marginBottom:'16px'}});
      var hintTitle=el('div',{cls:'card-title',sty:{color:'var(--green)'}});hintTitle.textContent='Auto-populated from your tool research';hintCard.appendChild(hintTitle);
      var hintDesc=el('div',{sty:{fontSize:'13px',color:'var(--muted)',marginBottom:'12px',lineHeight:'1.6'}});hintDesc.textContent='Based on the AI tools we looked up, we have pre-filled some answers below. Review them and adjust if needed.';hintCard.appendChild(hintDesc);
      hintNames.forEach(function(name){
        var h=hints3[name];var row=el('div',{sty:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',padding:'8px 0',borderBottom:'1px solid rgba(26,122,70,.1)'}});
        var rn=el('div',{sty:{fontSize:'13px',fontWeight:'600',color:'var(--navy)'}});rn.textContent=name;row.appendChild(rn);
        var rmeta=el('div',{sty:{fontSize:'12px',color:'var(--muted)',textAlign:'right'}});
        if(h.storageRegion)rmeta.textContent=(h.storageRegion==='Australia'?'✓ AU storage':'⚠ '+h.storageRegion+' storage')+(h.riskLevel?' · '+h.riskLevel+' risk':'');
        row.appendChild(rmeta);hintCard.appendChild(row);
      });
      mb.appendChild(hintCard);
    }
    var rc1=el('div',{cls:'card'});rc1.appendChild(el('div',{cls:'card-title'},'Data access & storage'));
    var s3secs=[{lbl:'Do any AI tools have access to client files or data?',key:'clientData',opts:['Yes — directly','Possibly — we paste content in','No — general queries only','Not sure']},{lbl:'Where is your AI tool data stored and processed?',key:'dataStorage',opts:['Australia only','Overseas servers','Mixture','Not sure']}];
    s3secs.forEach(function(sec){var f=el('div',{cls:'field'});f.appendChild(el('label',{cls:'field-label'},sec.lbl));f.appendChild(radioGroup(sec.opts,S[sec.key],function(v){var p={};p[sec.key]=v;ss(p);}));rc1.appendChild(f);});
    mb.appendChild(rc1);
    var rc2=el('div',{cls:'card'});rc2.appendChild(el('div',{cls:'card-title'},'Policies & training'));
    var s3secs2=[{lbl:'Does the firm have a documented AI usage policy?',key:'hasPolicy',opts:['Yes, a formal one','Informal guidelines only','No','In progress']},{lbl:'Have staff received training on appropriate AI use?',key:'hasTraining',opts:['Yes, formal training','Some staff have','No training','Planned but not done']}];
    s3secs2.forEach(function(sec){var f=el('div',{cls:'field'});f.appendChild(el('label',{cls:'field-label'},sec.lbl));f.appendChild(radioGroup(sec.opts,S[sec.key],function(v){var p={};p[sec.key]=v;ss(p);}));rc2.appendChild(f);});
    mb.appendChild(rc2);
  }

  if(stepIdx===4){
    var gc=el('div',{cls:'card'});gc.appendChild(el('div',{cls:'card-title'},'Goals & concerns'));
    var gf1=el('div',{cls:'field'});gf1.appendChild(el('label',{cls:'field-label'},'Biggest workflow pain points'));gf1.appendChild(pillGroup(PAIN_POINTS,S.painPoints,function(v){ss({painPoints:tog(S.painPoints,v)});}));gc.appendChild(gf1);
    var gf2=el('div',{cls:'field'});gf2.appendChild(el('label',{cls:'field-label'},'What would you most want AI to help achieve?'));var gta=el('textarea',{placeholder:'e.g. Reduce document drafting time, automate billing narratives, improve research speed...'});gta.value=S.goals;gta.addEventListener('input',function(e){S.goals=e.target.value;});gc.appendChild(gf2);gf2.appendChild(gta);
    var gf3=el('div',{cls:'field'});gf3.appendChild(el('label',{cls:'field-label'},'Main concerns about AI in your firm'));gf3.appendChild(pillGroup(CONCERNS,S.concerns,function(v){ss({concerns:tog(S.concerns,v)});}));gc.appendChild(gf3);
    mb.appendChild(gc);
  }

  if(stepIdx===5){
    var rv=el('div',{cls:'card'});rv.appendChild(el('div',{cls:'card-title'},'Review your answers'));
    var sp5=spend();
    var revRows=[{k:'Firm',v:S.firmName+' · '+S.staffCount+' staff'},{k:'Practice areas',v:S.practiceAreas.join(', ')||'—'},{k:'Software',v:S.software.join(', ')||'—'},{k:'AI tools',v:S.tools.filter(function(t){return t.name;}).length+' tool(s) · $'+sp5.toFixed(0)+'/month'},{k:'Client data access',v:S.clientData||'—'},{k:'Data storage',v:S.dataStorage||'—'},{k:'AI policy',v:S.hasPolicy||'—'},{k:'Staff training',v:S.hasTraining||'—'},{k:'Pain points',v:S.painPoints.join(', ')||'—'},{k:'Concerns',v:S.concerns.join(', ')||'—'}];
    var rt=el('div',{cls:'review-table'});
    revRows.forEach(function(row){var r2=el('div',{cls:'review-row'});r2.appendChild(el('span',{cls:'review-key'},row.k));r2.appendChild(el('span',{cls:'review-val'},row.v));rt.appendChild(r2);});
    rv.appendChild(rt);mb.appendChild(rv);
  }

  var m=missing();
  if(!canNext()&&m.length)mb.appendChild(el('div',{cls:'warn-box'},'Still needed: '+m.join(', ')));

  var sf=el('div',{cls:'step-footer'});
  var backBtns=el('div',{sty:{display:'flex',gap:'10px',alignItems:'center'}});
  if(stepIdx>0)backBtns.appendChild(el('button',{cls:'btn-secondary',onclick:function(){ss({step:stepIdx-1});}}, '← Back'));
  else backBtns.appendChild(el('div',{}));
  // If report already generated, show shortcut back to it
  if(S.report&&stepIdx<5){
    var backToReport=el('button',{cls:'btn-secondary',sty:{fontSize:'13px',color:'var(--muted)'},onclick:function(){ss({step:6});}});
    backToReport.textContent='↩ Back to report';
    backBtns.appendChild(backToReport);
  }
  sf.appendChild(backBtns);

  var nextBtn;
  if(stepIdx===1&&S.detectMethod==='billing'&&S.detected.length){nextBtn=el('button',{cls:'btn-primary',onclick:applyDetected});nextBtn.textContent='Use detected tools →';}
  else if(stepIdx===1&&S.detectMethod==='checklist'){nextBtn=el('button',{cls:'btn-primary',onclick:applyDetected});nextBtn.textContent='Use selected tools →';if(!S.checklist.length)nextBtn.disabled=true;}
  else if(stepIdx===1&&S.detectMethod==='manual'){nextBtn=el('button',{cls:'btn-primary',onclick:function(){ss({step:2});}});nextBtn.textContent='Enter tools manually →';}
  else if(stepIdx<5){nextBtn=el('button',{cls:'btn-primary',onclick:function(){ss({step:stepIdx+1});}});nextBtn.textContent='Continue →';if(!canNext())nextBtn.disabled=true;}
  else{nextBtn=el('button',{cls:'btn-primary',onclick:genReport});nextBtn.innerHTML='Generate report →';}
  sf.appendChild(nextBtn);mb.appendChild(sf);
  app.appendChild(mb);
}

render();
</script>
</body>
</html>
